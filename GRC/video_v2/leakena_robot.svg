<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- NTC, assistant robot of Ms. Sorn Leakena (GRC team) (cloud + internet provider theme). Animated part ids: #r-antenna-light,
       #r-antenna-glow, #r-wifi, #r-eyes, #r-mouth, #r-arm-r (rotates around 244,222), #r-shadow -->
  <defs>
    <linearGradient id="lk-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22C3E6"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="lk-skirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="lk-head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="lk-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <radialGradient id="lk-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
    <radialGradient id="lk-eye" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#CFFAFE"/><stop offset="1" stop-color="#22D3EE"/></radialGradient>
  </defs>
  <ellipse id="r-shadow" cx="150" cy="366" rx="78" ry="10" fill="#000" opacity="0.28"/>

  <!-- antenna with Wi-Fi waves (internet) -->
  <rect x="146" y="20" width="8" height="30" rx="4" fill="#1E3A8A"/>
  <circle id="r-antenna-glow" cx="150" cy="16" r="22" fill="url(#lk-glow)"/>
  <circle id="r-antenna-light" cx="150" cy="16" r="9" fill="#22D3EE" stroke="#fff" stroke-width="3"/>
  <g id="r-wifi" fill="none" stroke="#67E8F9" stroke-linecap="round" stroke-width="4">
    <path d="M128 4 a30 30 0 0 1 44 0"/>
    <path d="M118 -8 a44 44 0 0 1 64 0" opacity="0.7"/>
    <path d="M108 -20 a58 58 0 0 1 84 0" opacity="0.4"/>
  </g>

  <!-- cloud "hair" (cloud provider) with a small bow -->
  <g fill="url(#lk-cloud)">
    <circle cx="82" cy="78" r="34"/><circle cx="120" cy="54" r="38"/><circle cx="168" cy="50" r="40"/>
    <circle cx="214" cy="70" r="34"/><circle cx="236" cy="104" r="24"/><circle cx="64" cy="108" r="24"/>
  </g>
  <g transform="translate(206 44)">
    <path d="M0 0 l-18 -12 l0 24 z" fill="#FB7185"/><path d="M0 0 l18 -12 l0 24 z" fill="#FB7185"/>
    <circle r="6" fill="#F43F5E"/>
  </g>

  <!-- headset -->
  <rect x="34" y="96" width="24" height="52" rx="11" fill="#14B8A6"/>
  <rect x="242" y="96" width="24" height="52" rx="11" fill="#14B8A6"/>

  <!-- head + face screen -->
  <rect x="50" y="62" width="200" height="132" rx="48" fill="url(#lk-head)"/>
  <rect x="70" y="80" width="160" height="94" rx="32" fill="#0B1A33"/>
  <g id="r-eyes">
    <ellipse cx="114" cy="113" rx="16" ry="18" fill="url(#lk-eye)"/>
    <ellipse cx="186" cy="113" rx="16" ry="18" fill="url(#lk-eye)"/>
    <circle cx="120" cy="106" r="5" fill="#fff"/>
    <circle cx="192" cy="106" r="5" fill="#fff"/>
    <!-- eyelashes -->
    <path d="M98 99 l-7 -6 M104 95 l-4 -8 M200 95 l4 -8 M206 99 l7 -6" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="90" cy="140" r="9" fill="#FB7185" opacity="0.55"/>
  <circle cx="210" cy="140" r="9" fill="#FB7185" opacity="0.55"/>
  <path d="M250 140 q6 30 -38 34" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="210" cy="174" r="6" fill="#14B8A6"/>
  <rect id="r-mouth" x="134" y="146" width="32" height="6" rx="3" fill="#FDA4AF"/>

  <!-- neck + body + skirt -->
  <rect x="130" y="190" width="40" height="18" rx="6" fill="#1E3A8A"/>
  <path d="M84 300 L216 300 L240 346 L60 346 Z" fill="url(#lk-skirt)"/>
  <rect x="78" y="204" width="144" height="112" rx="40" fill="url(#lk-body)"/>
  <!-- badge: cloud + GRC -->
  <rect x="100" y="222" width="100" height="62" rx="16" fill="#fff" opacity="0.96"/>
  <path d="M126 248 a9 9 0 0 1 17 -4 a11 11 0 0 1 20 5 a8 8 0 0 1 -1 16 h-34 a8.5 8.5 0 0 1 -2 -17 z" fill="#38BDF8"/>
  <text x="150" y="278" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="#1E3A8A" letter-spacing="2">NTC</text>
  <!-- network dots (internet) -->
  <g stroke="#E0F2FE" stroke-width="2.5"><line x1="118" y1="298" x2="150" y2="306"/><line x1="150" y1="306" x2="182" y2="298"/></g>
  <circle cx="118" cy="298" r="6" fill="#E0F2FE"/><circle cx="150" cy="306" r="6" fill="#67E8F9"/><circle cx="182" cy="298" r="6" fill="#E0F2FE"/>

  <!-- hover base -->
  <rect x="104" y="340" width="92" height="14" rx="7" fill="#1E3A8A"/>
  <ellipse cx="150" cy="356" rx="40" ry="5" fill="#67E8F9" opacity="0.7"/>

  <!-- left arm holds a security shield -->
  <g id="r-arm-l">
    <rect x="44" y="214" width="34" height="88" rx="17" fill="#1E3A8A"/>
    <circle cx="61" cy="306" r="17" fill="#2563EB"/>
    <g transform="translate(40 268)">
      <path d="M0 0 l26 -10 l26 10 v22 c0 20 -14 32 -26 38 c-12 -6 -26 -18 -26 -38 z" fill="#10B981" stroke="#fff" stroke-width="4"/>
      <path d="M14 22 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- right arm (waves; rotates around the shoulder 244,222) -->
  <g id="r-arm-r">
    <rect x="222" y="214" width="34" height="88" rx="17" fill="#1E3A8A"/>
    <circle cx="239" cy="306" r="17" fill="#2563EB"/>
  </g>
</svg>
